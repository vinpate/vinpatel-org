name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          terraform fmt -check -recursive infra
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: node --test "edge/*.test.js"
      - run: actionlint

  # Every run builds and smoke-tests the binaries, with read access alone.
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Build
        id: build
        run: |
          version=$(scripts/build.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: scripts/smoke.sh dist/vinpatel-org-linux-amd64 "$VERSION"
        env:
          VERSION: ${{ steps.build.outputs.version }}

  # A push to main builds the same binaries again, checks them the same way,
  # then attests and releases them; only this job can write. The run number
  # keeps release tags in order.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Build
        id: build
        run: |
          version=$(scripts/build.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: scripts/smoke.sh dist/vinpatel-org-linux-amd64 "$VERSION"
        env:
          VERSION: ${{ steps.build.outputs.version }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "Built from $GITHUB_SHA."
