name: vinpatel-org

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  restart: unless-stopped
  networks: [edge]

services:
  web:
    <<: *hardening
    image: ghcr.io/vinpate/vinpatel-org:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    user: "65534:65534"
    mem_limit: 64m
    environment:
      SITE_HOST: vinpatel.org
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 48MiB # keeps the Go heap well under mem_limit

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: ["tunnel", "--no-autoupdate", "run"]
    mem_limit: 128m
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is unset; run op inject -i .env.tpl -o .env}
    depends_on:
      web:
        condition: service_healthy

networks:
  edge: {}
